[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "python-function-structure-comparator"
version = "0.1.0"
description = "Compare Python functions using signatures, AST structure, calls, literals, and source similarity."
requires-python = ">=3.11"
license = {file = "LICENSE.md"}

[project.scripts]
python-function-structure-comparator = "function_structure_comparator.cli:main"

[tool.setuptools.packages.find]
include = ["function_structure_comparator*"]
